---
- name: Add Tailscale APT signing key
  ansible.builtin.get_url:
    url: "{{ tailscale_apt_key_url }}"
    dest: "{{ tailscale_apt_keyring_path }}"
    mode: "0644"
  become: true
  tags:
    - tailscale

- name: Add Tailscale APT repository
  ansible.builtin.apt_repository:
    repo: "{{ tailscale_apt_repo }}"
    state: present
    filename: tailscale
  become: true
  tags:
    - tailscale

- name: Install tailscale package
  ansible.builtin.apt:
    name: "{{ tailscale_package }}"
    state: present
    update_cache: true
  become: true
  tags:
    - tailscale

- name: Enable and start tailscaled service
  ansible.builtin.systemd:
    name: "{{ tailscale_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
  become: true
  tags:
    - tailscale

- name: Check Tailscale connection status
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false
  become: true
  tags:
    - tailscale

- name: Connect to Tailscale network
  ansible.builtin.command: >
    tailscale up --auth-key={{ tailscale_auth_key }}
    {{ tailscale_up_flags }}
  no_log: true
  changed_when: true
  become: true
  when: >
    tailscale_status.rc != 0 or
    (tailscale_status.stdout | from_json).BackendState | default('') != 'Running'
  tags:
    - tailscale
