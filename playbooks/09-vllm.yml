---
- name: Deploy vLLM inference server
  hosts: llm_servers
  become: true
  gather_facts: true
  pre_tasks:
    - name: Assert base_domain is defined
      ansible.builtin.assert:
        that:
          - base_domain is defined
          - base_domain | length > 0
        fail_msg: "base_domain must be set in inventory (e.g. solvelio.com)"
  roles:
    - vllm
