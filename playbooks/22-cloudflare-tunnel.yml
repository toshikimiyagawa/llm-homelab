---
- name: Configure Cloudflare Tunnel and SSH CA trust
  hosts: llm01
  become: true
  pre_tasks:
    - name: Load SOPS infrastructure secrets  # noqa: run-once[task]
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../secrets/infra.sops.yml"
      delegate_to: localhost
      run_once: true
      no_log: true

    - name: Cache cloudflared tunnel token
      ansible.builtin.set_fact:
        vault_cloudflared_tunnel_token: "{{ cloudflared_tunnel_token }}"
      no_log: true

    - name: Ensure cloudflared tunnel token is provided
      ansible.builtin.assert:
        that:
          - vault_cloudflared_tunnel_token is defined
          - vault_cloudflared_tunnel_token | length > 0
        fail_msg: >-
          cloudflared_tunnel_token が未設定です。
          secrets/infra.sops.yml に Terraform output の tunnel token を格納してください
          (docs/operations.md 参照)。
      no_log: true
  roles:
    - cloudflared
