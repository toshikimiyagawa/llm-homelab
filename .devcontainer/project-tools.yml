# Project-specific tools — installed automatically on devcontainer creation.
# Uncomment or add entries as needed. Versions are optional (omit for latest).
#
# apt:
#   - postgresql-client
#   - redis-tools
#
pip:
  - yamllint
  - ansible-lint
#
npm:
  - "@ai-sdk/openai-compatible"
#
binary:
  - name: op
    url: "https://cache.agilebits.com/dist/1P/op2/pkg/v2.30.0/op_linux_${ARCH}_v2.30.0.zip"
#
post_install:
  - name: install ansible-core via uv
    run: uv tool install ansible-core
  - name: install ansible collections
    run: PATH="/home/ubuntu/.local/bin:$PATH" ANSIBLE_HOME=/home/ubuntu/.ansible ansible-galaxy collection install -r /workspace/requirements.yml
  - name: install sops cli
    run: |
      # Runtime dependency for community.sops.load_vars reading secrets/infra.sops.yml.
      # The age private key is not installed by project tooling; keep it at ~/.config/sops/age/keys.txt.
      SOPS_VERSION=v3.13.1
      tmp="$(mktemp -d)"
      trap 'rm -rf "$tmp"' EXIT
      sops_asset="sops-${SOPS_VERSION}.linux.${ARCH}"
      curl -fsSL -o "$tmp/$sops_asset" "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/$sops_asset"
      curl -fsSL -o "$tmp/sops.checksums.txt" "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.checksums.txt"
      (cd "$tmp" && grep "sops-${SOPS_VERSION}.linux.${ARCH}$" sops.checksums.txt | sha256sum -c -)
      sudo install -m 0755 "$tmp/$sops_asset" /usr/local/bin/sops
      sops --version
  - name: install age cli
    run: |
      # Runtime helper for SOPS age keys. Key material remains user-managed.
      AGE_VERSION=1.3.1
      tmp="$(mktemp -d)"
      trap 'rm -rf "$tmp"' EXIT
      curl -fsSL -o "$tmp/age.tar.gz" "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-${ARCH}.tar.gz"
      tar -xzf "$tmp/age.tar.gz" -C "$tmp"
      sudo install -m 0755 "$tmp/age/age" /usr/local/bin/age
      sudo install -m 0755 "$tmp/age/age-keygen" /usr/local/bin/age-keygen
      age --version
      age-keygen --version
  - name: install terraform cli
    run: |
      # Cloudflare Terraform validation for infra/cloudflare.
      TERRAFORM_VERSION=1.13.5
      tmp="$(mktemp -d)"
      trap 'rm -rf "$tmp"' EXIT
      curl -fsSL -o "$tmp/terraform.zip" "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_${ARCH}.zip"
      unzip -q "$tmp/terraform.zip" -d "$tmp"
      sudo install -m 0755 "$tmp/terraform" /usr/local/bin/terraform
      terraform version
  - name: install opencode
    run: curl -fsSL https://opencode.ai/install | bash && sudo cp "$HOME/.opencode/bin/opencode" /usr/local/bin/opencode
  - name: configure opencode for vLLM
    run: |
      mkdir -p /home/ubuntu/.config/opencode
      cat > /home/ubuntu/.config/opencode/opencode.json <<'EOF'
      {
        "$schema": "https://opencode.ai/config.json",
        "model": "vllm/qwen3.5-122b-a10b-nvfp4",
        "provider": {
          "vllm": {
            "npm": "@ai-sdk/openai-compatible",
            "name": "vLLM",
            "options": {
              "baseURL": "https://vllm.solvelio.com/v1",
              "apiKey": "dummy"
            },
            "models": {
              "qwen3.5-122b-a10b-nvfp4": {
                "name": "Qwen3.5-122B-A10B-NVFP4",
                "limit": {
                  "context": 32768,
                  "output": 8192
                }
              }
            }
          }
        }
      }
      EOF
#
# For complex setup, you can also create .devcontainer/post-install.sh (must be executable).
